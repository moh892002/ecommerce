<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopWave — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>

  <!-- Login Screen -->
  <div class="container" id="loginScreen">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 p-4">
          <div class="card-body">
            <div class="text-center mb-4">
              <i class="bi bi-shop fs-1 text-primary"></i>
              <h4 class="fw-bold mt-2">ShopWave Admin</h4>
              <p class="text-muted small">Sign in to manage your store</p>
            </div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label small">Username</label>
                <input type="text" class="form-control" id="loginUser" value="admin" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" class="form-control" id="loginPass" value="admin123" required>
              </div>
              <div class="text-danger small mb-2 d-none" id="loginError">Invalid credentials</div>
              <button class="btn btn-primary w-100" type="submit">Sign In</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="d-none" id="dashboardScreen">
    <div class="d-flex" style="min-height:100vh;">

      <!-- Sidebar -->
      <nav class="sidebar d-flex flex-column flex-shrink-0 p-3">
        <a class="navbar-brand fw-bold mb-4 text-decoration-none" href="#">
          <i class="bi bi-shop text-primary"></i> <span class="text-white">ShopWave</span>
        </a>
        <ul class="nav nav-pills flex-column mb-auto gap-1">
          <li class="nav-item">
            <button class="nav-link active sidebar-link" data-page="dashboard">
              <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link sidebar-link" data-page="products">
              <i class="bi bi-box-seam me-2"></i> Products
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link sidebar-link" data-page="orders">
              <i class="bi bi-truck me-2"></i> Orders
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link sidebar-link" data-page="categories">
              <i class="bi bi-tags me-2"></i> Categories
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link sidebar-link" data-page="users">
              <i class="bi bi-people me-2"></i> Users
            </button>
          </li>
        </ul>
        <hr class="text-secondary">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-left me-1"></i> Logout
        </button>
      </nav>

      <!-- Main Content -->
      <main class="flex-grow-1 p-4 overflow-auto">
        <div id="pageContent">
          <!-- Injected by JS -->
        </div>
      </main>
    </div>
  </div>

  <!-- Product Form Modal -->
  <div class="modal fade" id="productFormModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productFormTitle">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="productForm">
          <div class="modal-body">
            <input type="hidden" id="pfId">
            <div class="row g-2">
              <div class="col-8"><label class="form-label small">Name</label><input class="form-control form-control-sm" id="pfName" required></div>
              <div class="col-4"><label class="form-label small">Category</label><select class="form-select form-select-sm" id="pfCategory"><option>electronics</option><option>clothing</option><option>home</option><option>accessories</option></select></div>
              <div class="col-4"><label class="form-label small">Price ($)</label><input type="number" step="0.01" class="form-control form-control-sm" id="pfPrice" required></div>
              <div class="col-4"><label class="form-label small">Original Price</label><input type="number" step="0.01" class="form-control form-control-sm" id="pfOriginalPrice" placeholder="null = no sale"></div>
              <div class="col-2"><label class="form-label small">Sale</label><select class="form-select form-select-sm" id="pfSale"><option value="false">No</option><option value="true">Yes</option></select></div>
              <div class="col-2"><label class="form-label small">Rating</label><input type="number" step="0.1" min="0" max="5" class="form-control form-control-sm" id="pfRating" required></div>
              <div class="col-12"><label class="form-label small">Image URL</label>
                <div class="input-group input-group-sm">
                  <input class="form-control" id="pfImage" required>
                  <button class="btn btn-outline-primary" type="button" id="pfImageUploadBtn" title="Upload image"><i class="bi bi-upload"></i></button>
                </div>
                <input type="file" id="pfImageFileInput" accept="image/*" class="d-none">
              </div>
              <div class="col-12"><label class="form-label small">Description</label><textarea class="form-control form-control-sm" id="pfDesc" rows="2" required></textarea></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm" id="pfSubmit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Category Form Modal -->
  <div class="modal fade" id="categoryFormModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="catFormTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="categoryForm">
          <div class="modal-body">
            <label class="form-label small">Category Name</label>
            <input class="form-control" id="catName" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm" id="catSubmit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/admin/admin.ts"></script>
</body>
</html>
